name: Publish images

# Builds both images away from the tiny production box and pushes them to GHCR, so the
# server only ever pulls (booster B8 in plans/small-box-deployment-tuning.md).

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'plans/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR requires a lowercase path; the repository owner is "JetPi".
  IMAGE_OWNER: jetpi
  # Baked into the client bundle at build time, so it must be the public API origin.
  API_BASE_URL: https://api.shinobitactics.dev

jobs:
  api:
    name: API image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build context must be the repository root: the API project links
      # ../test-data/seed-profiles.json (see server/ProjectHiddenVillage.Server.csproj).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/phv-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/phv-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  web:
    name: Client image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ env.API_BASE_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/phv-web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/phv-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
