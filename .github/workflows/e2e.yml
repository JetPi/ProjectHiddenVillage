name: E2E

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=project_hidden_village_ci;Username=postgres;Password=postgres
      Jwt__Key: local-dev-e2e-ci-key-for-github-actions-only

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: project_hidden_village_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d project_hidden_village_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.*

      - name: Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Restore server dependencies
        run: dotnet restore server/ProjectHiddenVillage.Server.csproj

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Preflight support metadata (N-008)
        run: |
          set -euo pipefail

          npm run dev > /tmp/phv-e2e-preflight-server.log 2>&1 &
          server_pid=$!

          cleanup() {
            if kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" || true
              wait "$server_pid" || true
            fi
          }
          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null; then
              break
            fi
            sleep 1
          done

          login_payload='{"email":"test-user-1@hiddenvillage.local","password":"TestUser1!"}'
          login_response=$(curl -fsS -X POST \
            -H "Content-Type: application/json" \
            -d "$login_payload" \
            http://127.0.0.1:3001/api/user/login)

          access_token=$(echo "$login_response" | node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync(0,'utf8'));process.stdout.write(data.accessToken||'');")
          if [ -z "$access_token" ]; then
            echo "Preflight failed: could not retrieve access token for seeded test user."
            echo "Server log tail:"
            tail -n 120 /tmp/phv-e2e-preflight-server.log || true
            exit 1
          fi

          game_payload='{"userId":"20000000-0000-0000-0000-000000000001","deckId":"10000000-0000-0000-0000-000000000001"}'
          game_response=$(curl -fsS -X POST \
            -H "Authorization: Bearer $access_token" \
            -H "Content-Type: application/json" \
            -d "$game_payload" \
            http://127.0.0.1:3001/api/games)

          game_code=$(echo "$game_response" | node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync(0,'utf8'));process.stdout.write((data.id||'').toString());")
          if [ -z "$game_code" ]; then
            echo "Preflight failed: could not create a game to inspect seeded card catalog."
            echo "Server log tail:"
            tail -n 120 /tmp/phv-e2e-preflight-server.log || true
            exit 1
          fi

          cards_response=$(curl -fsS \
            http://127.0.0.1:3001/api/games/"$game_code"/cards)

          has_support=$(echo "$cards_response" | node -e "const fs=require('fs');const cards=JSON.parse(fs.readFileSync(0,'utf8'));const c=cards.find(x=>String(x.id||'').toUpperCase()==='N-008');const ok=!!c&&(String(c.supportName||'').trim().length>0||String(c.supportEffect||'').trim().length>0);process.stdout.write(ok?'true':'false');")

          if [ "$has_support" != "true" ]; then
            echo "Preflight failed: N-008 is missing support metadata in CI seed state."
            echo "Server log tail:"
            tail -n 120 /tmp/phv-e2e-preflight-server.log || true
            exit 1
          fi

      - name: Run Playwright e2e
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
