<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>client</title>
    <style>
      html,
      body,
      #root {
        background: #05070c;
      }

      body {
        margin: 0;
      }

      .app-boot-loader {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: 'Space Grotesk', sans-serif;
        background: radial-gradient(circle at 20% 20%, #1d4ed8 0%, #0f172a 28%, #090f1f 58%, #05070c 100%);
        color: #ffffff;
      }

      .app-boot-loader__card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(17, 24, 39, 0.8);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .app-boot-loader__dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #fb923c;
        animation: app-boot-pulse 900ms ease-in-out infinite;
      }

      @keyframes app-boot-pulse {
        0%,
        100% {
          opacity: 0.4;
          transform: scale(0.9);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
    <script>
      ;(() => {
        const defaultTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'

        try {
          const raw = window.localStorage.getItem('phv-theme')
          if (!raw) {
            document.documentElement.dataset.theme = defaultTheme
            return
          }

          const parsed = JSON.parse(raw)
          const persistedTheme = parsed?.state?.theme
          const resolvedTheme = persistedTheme === 'light' || persistedTheme === 'dark' ? persistedTheme : defaultTheme
          document.documentElement.dataset.theme = resolvedTheme
        } catch {
          document.documentElement.dataset.theme = defaultTheme
        }
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <div class="app-boot-loader" role="status" aria-live="polite" aria-busy="true">
        <div class="app-boot-loader__card">
          <span class="app-boot-loader__dot"></span>
          <span>Loading...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
